name: Publica IG

on:
  schedule:
    # De hora em hora, das 8h às 22h BRT (UTC-3, sem horário de verão), no minuto 13.
    # O GitHub atrasa/descarta crons em hora cheia (muita gente agenda em :00), por isso o
    # minuto quebrado. Cada run publica os posts do dia cujo scheduleAt (HH:MM BRT) já
    # chegou e que ainda não estão no feed (checagem de legenda). Se um cron falhar, o da
    # hora seguinte pega o que ficou. Guarda de janela (8–23h BRT) impede post de madrugada.
    - cron: '13 11 * * *'   # 08:13 BRT
    - cron: '13 12 * * *'   # 09:13 BRT
    - cron: '13 13 * * *'   # 10:13 BRT
    - cron: '13 14 * * *'   # 11:13 BRT
    - cron: '13 15 * * *'   # 12:13 BRT
    - cron: '13 16 * * *'   # 13:13 BRT
    - cron: '13 17 * * *'   # 14:13 BRT
    - cron: '13 18 * * *'   # 15:13 BRT
    - cron: '13 19 * * *'   # 16:13 BRT
    - cron: '13 20 * * *'   # 17:13 BRT
    - cron: '13 21 * * *'   # 18:13 BRT
    - cron: '13 22 * * *'   # 19:13 BRT
    - cron: '13 23 * * *'   # 20:13 BRT
    - cron: '13 0 * * *'    # 21:13 BRT
    - cron: '13 1 * * *'    # 22:13 BRT
  workflow_dispatch:      # permite disparo manual pra testar
    inputs:
      post:
        description: 'Caminho de um post específico (opcional, ex: posts/semana39/post-01-manifesto.json)'
        required: false

# Um run por vez: dois runs simultâneos podiam checar o feed antes de o outro publicar e
# duplicar o post. O run novo espera o anterior terminar (não cancela).
concurrency:
  group: publica-ig
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publicar post do dia
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node ig/publish-ci.mjs ${{ github.event.inputs.post }}
